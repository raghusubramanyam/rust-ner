[package]
name = "aegis-ner"
version = "0.1.0"
edition = "2021"
description = "AEGIS NER runtime PII detection — regex + ONNX DistilBERT"
license = "MIT"

[[bin]]
name = "aegis-ner"
path = "src/main.rs"

[lib]
name = "aegis_ner"
path = "src/lib.rs"

[[bench]]
name = "inference_bench"
harness = false

[dependencies]
# ONNX Runtime for model inference
ort = { version = "2.0.0-rc.11", features = ["load-dynamic"] }

# HuggingFace tokenizer (pure Rust, no Python)
tokenizers = "0.19"

# Regex for structured PII detection
regex = "1"
once_cell = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
